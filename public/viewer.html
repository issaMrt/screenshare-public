<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: #000; color: #eee; font-family: sans-serif;
    height: 100%; overflow: hidden;
  }
  #stage {
    display: flex; flex-direction: column;
    height: 100vh;              /* fallback pour vieux navigateurs */
    height: 100dvh;             /* hauteur reelle visible sur mobile (s'adapte a la barre d'adresse) */
    position: relative;
  }
  #videoWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; min-height: 0; position: relative;
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #controls {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    width: 100%;
    position: absolute; left: 0; bottom: 0; z-index: 3;
    box-sizing: border-box;
    transition: transform .3s ease, opacity .3s ease;
  }
  #controls.hidden {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
  }
  button {
    background: rgba(255, 255, 255, 0.08); color: #fff; border: none;
    border-radius: 8px; cursor: pointer;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s ease;
  }
  button svg { width: 20px; height: 20px; fill: #fff; }
  button:hover { background: rgba(255, 255, 255, 0.18); }
  #fullscreenBtn { margin-left: auto; }
  #volumeGroup {
    display: flex; align-items: center; gap: 8px;
  }
  #volumeSlider {
    -webkit-appearance: none; appearance: none;
    width: 90px; height: 4px; border-radius: 2px;
    background: linear-gradient(to right, #fff 0%, #fff var(--vol, 100%), rgba(255,255,255,0.25) var(--vol, 100%), rgba(255,255,255,0.25) 100%);
    outline: none; cursor: pointer;
  }
  #volumeSlider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; cursor: pointer;
  }
  #volumeSlider::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; cursor: pointer; border: none;
  }
  select {
    background: rgba(255, 255, 255, 0.08); color: #fff; border: none;
    padding: 10px 12px; border-radius: 8px; font-size: 13px;
    font-weight: 600; letter-spacing: .02em;
  }
  select:hover { background: rgba(255, 255, 255, 0.18); }
  select:focus { outline: 2px solid #4f7cff; outline-offset: 1px; }
  select option {
    background: #1e1e1e; color: #fff;
  }
  #status { position: absolute; top: 10px; left: 10px; color: #888; font-size: 13px; z-index: 2; }

  #chatToggle { position: relative; }
  #chatBadge {
    position: absolute; top: -4px; right: -4px;
    background: #e5484d; color: #fff; font-size: 10px; font-weight: 700;
    min-width: 16px; height: 16px; border-radius: 8px;
    display: none; align-items: center; justify-content: center; padding: 0 3px;
  }

  #chatPanel {
    position: absolute; bottom: 70px; right: 16px; width: 280px; max-height: 360px;
    background: #17191c; border: 1px solid #2a2d31; border-radius: 12px;
    display: none; flex-direction: column; overflow: hidden; z-index: 5;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #chatPanel.open { display: flex; }
  #chatHeader {
    padding: 10px 14px; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid #2a2d31; color: #ccc;
  }
  #chatMessages {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 120px; max-height: 240px;
  }
  .chat-msg { font-size: 13px; line-height: 1.4; max-width: 90%; }
  .chat-msg .who { font-size: 11px; color: #7a7f87; margin-bottom: 2px; }
  .chat-msg .bubble { background: #262a2f; padding: 7px 10px; border-radius: 8px; display: inline-block; }
  .chat-msg.mine { align-self: flex-end; }
  .chat-msg.mine .bubble { background: #2e5bff; }
  .chat-empty { color: #666; font-size: 12px; text-align: center; padding: 16px 0; }
  #chatInputRow {
    display: flex; gap: 6px; padding: 10px; border-top: 1px solid #2a2d31;
  }
  #chatInput {
    flex: 1; background: #222; border: 1px solid #3a3d41; color: #fff;
    padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none;
  }
  #chatSend {
    width: 36px; height: 36px; flex-shrink: 0;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="videoWrap">
      <p id="status">Connexion...</p>
      <video id="remoteVideo" autoplay playsinline muted></video>
      <div id="chatPanel">
        <div id="chatHeader">Chat avec l'emetteur</div>
        <div id="chatMessages"><p class="chat-empty">Aucun message</p></div>
        <div id="chatInputRow">
          <input type="text" id="chatInput" placeholder="Ecrire un message..." maxlength="500">
          <button id="chatSend" title="Envoyer">
            <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="controls">
      <div id="volumeGroup">
        <button id="soundBtn" title="Son">
          <svg id="soundIconOff" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
          <svg id="soundIconOn" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <input type="range" id="volumeSlider" min="0" max="100" value="0">
      </div>
      <select id="qualitySelect">
        <option value="low">480p</option>
        <option value="medium" selected>720p</option>
        <option value="high">1080p</option>
      </select>
      <button id="chatToggle" title="Chat">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <span id="chatBadge">0</span>
      </button>
      <button id="fullscreenBtn" title="Plein ecran">
        <svg id="fsIconEnter" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="fsIconExit" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>

<script>
const video = document.getElementById('remoteVideo');
const soundBtn = document.getElementById('soundBtn');
const soundIconOff = document.getElementById('soundIconOff');
const soundIconOn = document.getElementById('soundIconOn');
const volumeSlider = document.getElementById('volumeSlider');
const qualitySelect = document.getElementById('qualitySelect');
const statusEl = document.getElementById('status');

let ws;
let pc;
let lastVolume = 100; // volume memorise pour le bouton mute/unmute
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'viewer-join' }));
    statusEl.textContent = 'En attente de l\'emetteur...';
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'offer') {
      await setupPeer();
      await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'answer', to: 'broadcaster', answer }));
      statusEl.textContent = 'En direct';
    }

    if (msg.type === 'ice-candidate' && pc && msg.candidate) {
      try { await pc.addIceCandidate(msg.candidate); } catch (e) { console.warn(e); }
    }

    if (msg.type === 'broadcaster-left') {
      statusEl.textContent = 'Emission terminee';
      video.srcObject = null;
    }

    if (msg.type === 'chat-message') {
      addChatMessage(msg.text, msg.from === 'broadcaster' ? 'Emetteur' : 'Vous', msg.from === 'broadcaster');
      if (!chatPanel.classList.contains('open')) {
        unreadCount++;
        chatBadge.textContent = unreadCount;
        chatBadge.style.display = 'flex';
      }
    }
  };

  ws.onclose = () => { statusEl.textContent = 'Deconnecte'; };
}

async function setupPeer() {
  pc = new RTCPeerConnection(rtcConfig);

  pc.ontrack = (event) => {
    video.srcObject = event.streams[0];
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      ws.send(JSON.stringify({ type: 'ice-candidate', to: 'broadcaster', candidate: e.candidate }));
    }
  };
}

function updateSoundIcon(volume) {
  const isMuted = volume === 0;
  soundIconOff.style.display = isMuted ? 'block' : 'none';
  soundIconOn.style.display = isMuted ? 'none' : 'block';
}

function setVolume(value) {
  video.muted = value === 0;
  video.volume = value / 100;
  volumeSlider.value = value;
  volumeSlider.style.setProperty('--vol', value + '%');
  updateSoundIcon(value);
}

// Slider deplace par l'utilisateur
volumeSlider.addEventListener('input', () => {
  const value = Number(volumeSlider.value);
  if (value > 0) lastVolume = value;
  setVolume(value);
});

// Bouton = mute / unmute rapide
soundBtn.onclick = () => {
  const value = Number(volumeSlider.value);
  if (value > 0) {
    setVolume(0);
  } else {
    setVolume(lastVolume || 100);
  }
};

// Etat initial : coupe (le navigateur bloque l'autoplay avec son)
setVolume(0);

qualitySelect.onchange = () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'quality-request', quality: qualitySelect.value }));
  }
};

const fullscreenBtn = document.getElementById('fullscreenBtn');
const stage = document.getElementById('stage');
const fsIconEnter = document.getElementById('fsIconEnter');
const fsIconExit = document.getElementById('fsIconExit');

fullscreenBtn.onclick = () => {
  if (!document.fullscreenElement) {
    stage.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
};

document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  fsIconEnter.style.display = isFs ? 'none' : 'block';
  fsIconExit.style.display = isFs ? 'block' : 'none';

  if (isFs) {
    startAutoHide();
  } else {
    stopAutoHide();
    showControls();
  }
});

// ==== AUTO-MASQUAGE DE LA BARRE EN PLEIN ECRAN ====
const controls = document.getElementById('controls');
let hideTimer = null;
const HIDE_DELAY = 2500; // ms d'inactivite avant de masquer la barre (desktop)

function isControlsVisible() {
  return !controls.classList.contains('hidden');
}

function showControls() {
  controls.classList.remove('hidden');
}

function hideControls() {
  // Ne jamais masquer si le chat est ouvert ou si le select est en cours d'utilisation
  if (chatPanel.classList.contains('open')) return;
  if (document.activeElement === qualitySelect) return;
  controls.classList.add('hidden');
}

// Desktop : bouger la souris reaffiche la barre et relance le minuteur d'auto-masquage
function resetHideTimer() {
  showControls();
  clearTimeout(hideTimer);
  if (document.fullscreenElement) {
    hideTimer = setTimeout(hideControls, HIDE_DELAY);
  }
}

// Mobile : un tap bascule simplement l'affichage (montre si cachee, cache si visible)
function toggleControlsOnTap(e) {
  // Ignore les taps qui viennent des controles eux-memes (boutons, slider, select, chat)
  if (controls.contains(e.target) || (chatPanel && chatPanel.contains(e.target))) return;
  clearTimeout(hideTimer);
  if (isControlsVisible()) {
    hideControls();
  } else {
    showControls();
    // Si la barre vient d'etre re-affichee par un tap, on la remasque apres un delai
    hideTimer = setTimeout(hideControls, HIDE_DELAY);
  }
}

function startAutoHide() {
  resetHideTimer();
  document.addEventListener('mousemove', resetHideTimer);
  document.addEventListener('touchstart', toggleControlsOnTap);
}

function stopAutoHide() {
  clearTimeout(hideTimer);
  document.removeEventListener('mousemove', resetHideTimer);
  document.removeEventListener('touchstart', toggleControlsOnTap);
}

// ==== CHAT ====
const chatToggle = document.getElementById('chatToggle');
const chatPanel = document.getElementById('chatPanel');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatBadge = document.getElementById('chatBadge');
let unreadCount = 0;

function addChatMessage(text, who, isFromBroadcaster) {
  const empty = chatMessages.querySelector('.chat-empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'chat-msg' + (isFromBroadcaster ? '' : ' mine');
  div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

chatToggle.onclick = () => {
  chatPanel.classList.toggle('open');
  if (chatPanel.classList.contains('open')) {
    unreadCount = 0;
    chatBadge.style.display = 'none';
    chatInput.focus();
  }
};

function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'chat-message', text }));
  addChatMessage(text, 'Vous', false);
  chatInput.value = '';
}

chatSend.onclick = sendChatMessage;
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatMessage();
});

connectWS();
</script>
</body>
</html>
